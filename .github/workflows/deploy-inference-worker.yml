name: Deploy inference Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-inference-worker.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Validar secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_SYSTEM_PROMPT_B64: ${{ secrets.NVIDIA_SYSTEM_PROMPT_B64 }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NVIDIA_API_KEY NVIDIA_SYSTEM_PROMPT_B64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret $name não configurado"
              exit 1
            fi
          done

      - name: Criar secrets temporários
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_SYSTEM_PROMPT_B64: ${{ secrets.NVIDIA_SYSTEM_PROMPT_B64 }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(
            "/tmp/worker-secrets.json",
            JSON.stringify({
              NVIDIA_API_KEY: process.env.NVIDIA_API_KEY,
              NVIDIA_SYSTEM_PROMPT_B64: process.env.NVIDIA_SYSTEM_PROMPT_B64
            })
          );
          NODE
          chmod 600 /tmp/worker-secrets.json

      - name: Deploy Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          npx --yes wrangler@latest deploy \
            --config worker/wrangler.jsonc \
            --secrets-file /tmp/worker-secrets.json \
            2>&1 | tee /tmp/wrangler-output.txt

          WORKER_URL="$(
            grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' \
              /tmp/wrangler-output.txt \
              | tail -n 1
          )"

          if [[ -z "$WORKER_URL" ]]; then
            echo "::error::Wrangler não retornou a URL workers.dev"
            exit 1
          fi

          echo "url=$WORKER_URL" >> "$GITHUB_OUTPUT"
          echo "Worker: $WORKER_URL"

      - name: Testar API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS "${{ steps.deploy.outputs.url }}/api/health"; then
              echo
              echo "API pronta."
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Conectar Pages ao Worker
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          cat > api-config.js <<EOF_CONFIG
          /* Gerado automaticamente pelo deploy do backend. Não contém segredos. */
          window.SNES_API_BASE = "${WORKER_URL}";
          EOF_CONFIG

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add api-config.js

          if git diff --cached --quiet; then
            echo "Configuração já atual."
            exit 0
          fi

          git commit -m "chore: connect Pages to inference API"
          git push origin HEAD:main

      - name: Limpar secrets temporários
        if: always()
        run: rm -f /tmp/worker-secrets.json
